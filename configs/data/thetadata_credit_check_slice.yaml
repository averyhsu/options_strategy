# ThetaData acquisition spec — real-chain credit check slice
#
# Source of truth for the sample plan: reports/candle_study.md
# "Mini-purchase specification" (51 regime-stratified entry Fridays).
# Acquisition vendor changed from a CBOE DataShop one-off purchase to a
# ThetaData subscription (user directive 2026-08-17): Options STANDARD tier
# ($80/mo) — options tick/NBBO history from 2016-01-01 covers every sample
# date below, and the at_time snapshot endpoints need Standard+.
#
# Licensed vendor data: everything fetched with this config lands in
# data/raw/thetadata/ (gitignored — the repo is public; never commit).
#
# Snapshot times: the spec's EOD snapshot is 15:45 ET (primary) with 16:00
# as a close-rotation companion; 10:00 ET is the "cheap bonus" morning
# snapshot. Subscription pricing makes all three free to take.

vendor: thetadata
dataset: credit_check_slice
out_root: data/raw/thetadata/credit_check_slice

# Official python-library transport (gRPC, no Theta Terminal). The creds file
# (email line 1, password line 2) is read by the vendor library only — this
# codebase never reads its contents.
auth:
  creds_file: ~/theta/creds.txt
# STANDARD tier (verified 2026-08-18): 4 concurrent allowed; we stay sequential
# at 2 req/s — well inside the allowance, ~40-75 min for the full 51-date slice
rate_limit_per_min: 120

roots: [SPX, SPXW]        # AM-settled monthlies + PM-settled weeklys; never mixed downstream
max_dte: 63               # calendar days; covers front Friday + all §8.1 back-leg offsets
snapshot_times:           # ET, minute-boundary (sub-minute times stall the terminal)
  - "10:00:00"
  - "15:45:00"
  - "16:00:00"
primary_snapshot: "15:45:00"
strike_pad_points: 50     # widen the spec window for §8.1 wing offsets {0,25,50}

