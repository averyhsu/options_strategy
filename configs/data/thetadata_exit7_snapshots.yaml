# Exit-at-7dte REALIZED-return snapshots (user addendum 2026-08-18).
#
# +7-calendar-day exit sessions for entry Fridays whose exits do NOT coincide
# with another sample date's snapshots: calm-2017 (6) + bear-2022 (10), plus
# the tail exit of each weekly-consecutive window (volmageddon, covid, vix-2024,
# live-2026) whose final entry's exit falls outside the window. All +7d dates
# verified trading sessions; 2020-04-10 is Good Friday -> exit session 04-09.
#
# spot / strike windows are COPIED FROM THE PARENT ENTRY (the legs being
# marked were struck at entry; the window centers on entry spot).

vendor: thetadata
dataset: exit7_snapshots
out_root: data/raw/thetadata/exit7_snapshots

auth:
  creds_file: ~/theta/creds.txt
rate_limit_per_min: 120

roots: [SPX, SPXW]
max_dte: 63
snapshot_times:
  - "10:00:00"
  - "15:45:00"
  - "16:00:00"
primary_snapshot: "15:45:00"
strike_pad_points: 50

