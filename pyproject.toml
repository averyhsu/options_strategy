[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "options-strategy"
version = "0.1.0"
description = "Research-grade backtesting + parameter identification for weekly SPX double-diagonal option strategies (research software only; not investment advice)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    "exchange-calendars>=4.5",
    "pyarrow>=15",
]

[project.optional-dependencies]
# free daily-data fetch + candle-study figures (PLAN §8.3); not needed by the engine
freedata = [
    "yfinance>=0.2.40",
    "matplotlib>=3.8",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.90",
    "mypy>=1.8",
]

[project.scripts]
options_strategy = "options_strategy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["src/options_strategy/pricing", "src/options_strategy/engine"]
ignore_missing_imports = true
check_untyped_defs = true
